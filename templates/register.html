<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="/static/assets/img/logo/sstc-logo.png" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <title>SSTC Online Portal</title>
</head>

<body style="background-image: url('/static/assets/img/back.jpg') ">
    <div class="d-flex justify-content-center align-items-center heading"><img src="/static/assets/img/logo/unnamed - Copy.png"
            alt="" width="80px;" class="head">
        <span class="head">ONLINE TEST PORTAL</span></div>
    <div class="d-flex justify-content-center align-items-center login-container">

        <form class="login-form text-center" method="POST" action="/registerData">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <img src="/static/assets/img/user.png" alt="userlogo" style="width: 100px;">
            <h2 class="mb-3 mt-2 font-weight-light text-uppercase">Signup As</h2>
            {% if error %}
                <div class="alert alert-danger">
                  {{ error }}
                </div>
            {% endif %}
            <div class="form-group signup-opt">
                <input type="button" class="  btn2 rounded-pill" id="student" value="Student" onclick="student1()">
                <input type="button" class=" btn2 rounded-pill" id="faculty" value="Faculty" onclick="faculty1()">
            </div>
            <div class="form-group" id="details"></div>
        </form>
    </div>

    <div class="d-flex justify-content-center align-items-center footer">
        Copyright &copy; Your Website 2020</div>




    <!-- Bootstrap core JS-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js"></script>
    <!-- Third party plugin JS-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
    <!-- Contact form JS-->
    <script src="/static/assets/mail/jqBootstrapValidation.js"></script>
    <script src="/static/assets/mail/contact_me.js"></script>
    <!-- Core theme JS-->
    <script src="/static/js/scripts.js"></script>
</body>

<script>
                function student1() {
                    var csrf_token = "{{ csrf_token() }}";
                    $.ajaxSetup({
                        beforeSend: function(xhr, settings) {
                            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                                xhr.setRequestHeader("X-CSRFToken", csrf_token);
                            }
                        }
                    });
                  var xhttp = new XMLHttpRequest();
                  xhttp.onreadystatechange = function() {
                    if (xhttp.readyState === 4 && xhttp.status === 200) {
                      document.getElementById("details").innerHTML = xhttp.responseText;
                    }
                  };
                  xhttp.open("GET", "{{ url_for('student') }}", true);
                  xhttp.send();
    }
        function faculty1() {
                    var csrf_token = "{{ csrf_token() }}";
                    $.ajaxSetup({
                        beforeSend: function(xhr, settings) {
                            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                                xhr.setRequestHeader("X-CSRFToken", csrf_token);
                            }
                        }
                    });
                  var xhttp = new XMLHttpRequest();
                  xhttp.onreadystatechange = function() {
                    if (xhttp.readyState === 4 && xhttp.status === 200) {
                      document.getElementById("details").innerHTML = xhttp.responseText;
                    }
                  };
                  xhttp.open("GET", "{{ url_for('faculty') }}", true);
                  xhttp.send();
    }
</script>
</html>
