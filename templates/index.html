<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="/static/assets/img/logo/sstc-logo.png" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>SSTC Online Portal</title>
    <script>
        let vh = window.innerHeight;
        document.documentElement.style.setProperty('--vh', `${vh}px`);

        // We listen to the resize event
        window.addEventListener('resize', () => {
            // We execute the same script as before
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        });
    </script>
</head>

<body >
    <div class="main">

        <div class="heading"><span class="head-img"><img
                src="/static/assets/img/logo/sstc_logo.png" alt="" height="100%"></span>
            <span class="head-title">ONLINE TEST PORTAL</span>
        </div>

        <div class="login-container">
          <div class="login-wrapper">
            <form class="login-form text-center" method="POST" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                <img src="/static/assets/img/user.png" alt="userlogo" style="width: 100px;">
                <h2 class="mb-3 font-weight-light text-uppercase">Login</h2>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}
                <div class="form-group">
                    <input type="text" class="form-control rounded-pill form-control-lg" placeholder="User Id" required
                        name="Lid">
                </div>
                <div class="form-group">
                    <input type="password" class="form-control rounded-pill form-control-lg" placeholder="Password"
                        required name="Lpassword">
                </div>
                <div class="forgot-link form-group  justify-content-center align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember" style="margin-top: 2px;">Remember Me</label>
                    </div>

                </div>
                <a href="{{ url_for('resetpassword') }}" style="color:#ffffff;">Forgot Password?</a>
                <button type="submit" class="btn mt-3 rounded-pill btn-lg btn-custom btn-block text-uppercase">Log
                    in</button>
                <p class="mt-4 font-weight-normal">Don't have an account? <br><a href="{{ url_for('register') }}"
                        id="signup" style="color: aquamarine;">Signup
                        Now!</a></p>
            </form>
        </div>
        </div>

        <div class="footer">
            Copyright &copy; SSTC Bhilai 2020
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <script>

    </script>
</body>

</html>
