<!DOCTYPE html>
<html>
<head>
	<title></title>

	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">

	<style type="text/css">
 		canvas {
  max-width  : 200px; 
  height : 200px;
  border : 1px solid #c3c3c3;
  border-radius: 100px;
  background-color: white;
  margin-top: 10px;
  margin-right: 1%;
  background-image: url(/static/Profile_pics/default.jpg);
}
 	</style>
</head>
<body>
{% if current_user.is_authenticated %}
	<div class="container" style="margin-top: -90px;">
  <div class="row ">
    <div class="col-lg-12">
      <div>
        <div class="col-md-4">
          <div class="profile-card text-center">
          	<img class="img-fluid" src="/static/assets/img/profile_area/left.jpeg">
            <div class="profile-info">
			<div>
				<canvas id = "can">
				</canvas>
				<script src = 'http://www.dukelearntoprogram.com/course1/common/js/image/SimpleImage.js'>
				</script>
				<p>
				<label for="files" class="btn" style="border-color: black; color: black;">Select Image</label>
				      <input id="files" style="visibility:hidden; width: 0px;" multiple = "false" accept = "image/*" type="file" onchange="upload()">
				</p>
			</div>
			<div style="text-align: center; margin-bottom: 15px;">
				<div><input type="text" class="form-control" id="name" value="{{ current_user.username }}" name="" onkeyup="manage(this)"></div>
				<div><i>{{ current_user.role }}</i></div>
				<div style="margin-top: 30px;">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
					<input onclick="enable_disable()" type="submit" class="btn btn-primary" value="Save" id="myButton1">
					<input onclick="disable_enable()" type="button" class="btn btn-primary" value="Edit" id="myButton2">
                        </form>
				</div>
			</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="profile-card text-center" style="">
          	<img class="img-responsive" src="/static/assets/img/profile_area/center.jpeg">
            <div class="profile-info" style="">
              <div class="generalDetails" id="GFG"><!-- general Details -->
				<div style="text-decoration-line: underline; text-decoration-style: double;">
					<h3>General Details</h3>
				</div>
					<div><b><u>CSVTU Roll Number</u></b></div>
					<div><input type="text" class="form-control" id="csvtuRollNo" value="{{ current_user.userid }}" name="" onkeyup="manage(this)"></div>

					<div><b><u>College Name</u></b></div>
					<div><input type="text" class="form-control" id="clg" value="{{ current_user.college }}" name="" onkeyup="manage(this)"></div>
					
					<div><b><u>Branch</u></b></div>
					<div>
						<input type="text" class="form-control" id="clg" value="{{ current_user.branch }}" name="" onkeyup="manage(this)">
					</div>
					
					<div><b><u>Semester</u></b></div>
					<div>
						<input type="text" class="form-control" id="clg" value="{{ current_user.semester }}" name="" onkeyup="manage(this)">
					</div>
					<div><b><u>Section</u></b></div>
					<div><input type="text" class="form-control" id="section" value="{{ current_user.section }}" name="" onkeyup="manage(this)"></div>
					
					<div><b><u>Class Roll Number</u></b></div>
					<div><input type="text" class="form-control" id="clsRollNo" value="{{ current_user.rollno }}" name="" onkeyup="manage(this)"></div>
					
					<div><b><u>Email ID</u></b></div>
					<div><input type="email" class="form-control" id="email" value="{{ current_user.email }}" name="" onkeyup="manage(this)"></div>
				</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="profile-card text-center">
          	<img class="img-responsive" src="/static/assets/img/profile_area/right.jpeg">
            <div class="profile-info">
              <div class="examDetails"><!-- exam Details -->
				<div style="text-decoration-line: underline; text-decoration-style: double;">
					<h3>Exam Details</h3>
				</div>
				<div>
					<div><b><u>Number Of Exam Attended</u></b></div>
					<div>2</div>
					<div><b><u>Total Number Of Exam</u></b></div>
					<div>5</div>
				</div>
			</div>
			<div class="pw_change_section">
				<div><b><u>Reset Password</u></b></div>
				<div><a href="/templates/new_password.html">Change Password ?</a></div>
			</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endif %}
</body>
</html>
