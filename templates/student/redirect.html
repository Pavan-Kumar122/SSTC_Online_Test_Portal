        /*
    DEMO STYLE
*/
@import "https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700";
body {
    font-family: 'Poppins', sans-serif;
}
.navbar {
    padding: 10px 10px;
    background: #fff;
    border: none;
    border-radius: 0;
    margin-bottom: -25px;
    box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
    margin-top: -10px;
}

.navbar-btn {
    box-shadow: none;
    outline: none !important;
    border: none;
}

/* ---------------------------------------------------
    SIDEBAR STYLE
----------------------------------------------------- */

.wrapper {
    display: flex;
    align-items: stretch;
}

/* ---------------------------------------------------
    CONTENT STYLE
----------------------------------------------------- */

#content {
    width: 100%;
    padding: 20px;
    min-height: 100vh;
    transition: all 0.3s;
}


@media only screen and (min-width: 600px) {
 .result_header {
    width: 100%;
    margin-top: 20px;
    height: 95px;
    background-color: #f7f7f7;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
 }

 .result_timer {
    font-family: 'Oswald', sans-serif; font-size: 40px;
    margin-top: 30px; 
    text-align: center;
 }

 .result_table {
    width: 30%;
    height: auto; 
    margin-top: 50px;
    background-color: #f7f7f7;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22); 
    margin-left: 35%;
    border-radius: 15px;
 }

 .result_title {
 	 float: left; 
 	 font-size: 40px; 
 	 margin-top: 25px;
 	 font-family: 'Yanone Kaffeesatz', sans-serif;
 }
}

@media only screen and (max-width: 600px) {
 	.result_header {
    	width: 100%;
	    margin-top: 20px;
	    height: 95px;
	    background-color: #f7f7f7;
	    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
	 }

	 .result_timer {
	    font-family: 'Oswald', sans-serif; font-size: 30px;
	    margin-top: 30px; 
	    text-align: center;
	 }

	 .result_table {
	    width: 30%;
	    height: auto; 
	    margin-top: 30px;
	    background-color: #f7f7f7;
	    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22); 
	    margin-left: 35%;
	    border-radius: 15px;
	 }

	 .result_title {
	 	 float: left; 
	 	 font-size: 30px; 
	 	 margin-top: 25px;
	 	 font-family: 'Yanone Kaffeesatz', sans-serif;
	 }

	 tbody {
	 		font-size: x-small;
	 }
	 thead {
	 	font-size: medium;
	 }
 }

 .sstc-icon {
 	float: left;
 }
