    <style type="text/css">
          @import "https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700";
body {
    font-family: 'Poppins', sans-serif;
}

.wrapper {
    display: flex;
    align-items: stretch;
    min-height: 100vh;
}

#content {
    width: 100%;
    padding: 20px;
    padding-top: 70px;
    min-height: 100vh;
    transition: all 0.3s;
}

.result_table{
    width: 50%;
    min-width: 350px;
    background-color: #d8d8d8;
    border-radius: 10px;
    border: 2px solid #f05b5b;
}
.result_table td{
    border-top: 1px solid #777777;
    padding-left: 25px;
}
thead tr{
    text-align: center;
    background: #F05B5B;
 }
 #table-head{
     font-size: 25px;
     font-weight: 600;
 }

 tbody {
	 		font-size: 18px;
}
     
@media only screen and (min-width: 1200px){
    .result_table{
        width: 30% ;
    }
}
@media only screen and (min-width: 600px) {

 .result_timer {
    font-family: 'Oswald', sans-serif; font-size: 40px;
    margin-top: 30px; 
    text-align: center;
 }

 .result_table {
    height: auto; 
    margin: auto;
    margin-top: 50px;
 }

 .result_title {
 	 float: left; 
 	 font-size: 40px; 
 	 margin-top: 25px;
 	 font-family: 'Yanone Kaffeesatz', sans-serif;
 }
 
}

@media only screen and (max-width: 600px) {
 	
	 .result_timer {
	    font-family: 'Oswald', sans-serif; font-size: 30px;
	    margin-top: 30px; 
	    text-align: center;
	 }

	 .result_table {
	    width: 80%;
	    height: auto; 
        margin: auto;
	    margin-top: 30px;
	 }

	 .result_title {
	 	 float: left; 
	 	 font-size: 30px; 
	 	 margin-top: 25px;
	 	 font-family: 'Yanone Kaffeesatz', sans-serif;
	 }

	 tbody {
	 		font-size: 15px;
	 }
   }

    </style>
    <!-- Font Awesome JS -->
    <script defer src="https://use.fontawesome.com/releases/v5.0.13/js/solid.js" integrity="sha384-tzzSw1/Vo+0N5UhStP3bvwWPq+uvzCMfrN1fEFe+xBmv1C/AtVX5K0uZtmcHitFZ" crossorigin="anonymous"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.0.13/js/fontawesome.js" integrity="sha384-6OIrr52G08NpOFSZdxxz1xdNSndlD4vdcf/q2myIUVO0VsqaGHJsB0RaBE01VTOY" crossorigin="anonymous"></script>

<body>

    <div class="wrapper">      
        <div id="content">
			<div class="result_timer"> Thankyou! <br> You will be redirected to home page in 10 seconds.</div>
			<div class="table-responsive result_table">
				<table class="table ">
					<thead class="text-center">
						<tr>
							<th id="table-head">Test Result</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>Attempted- {{ attempt }}</td>
						</tr>
						<tr>
							<td>Correct- {{ correct }}</td>
						</tr>
						<tr>
							<td>Marks Obtained- {{ marks }}</td>
						</tr>
						<tr>
							<td>Out of- {{ outof }} Questions</td>
						</tr>
					</tbody>
				</table>
			</div>
        </div>
    </div>

    <!-- jQuery CDN - Slim version (=without AJAX) -->

       window.location.href = '{{ url_for('student_login') }}';
