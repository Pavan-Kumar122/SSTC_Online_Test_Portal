<!DOCTYPE html>
<html>
<head>
	<title>SSTC- Test Portal<</title>

    <link rel="icon" type="image/x-icon" href="/static/assets/img/logo/unnamed - Copy.png" />

        <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet"> 
	<style>
 .result_header {
    width: 100%;
    margin-top: 20px;
    height: 95px;
    background-color: #f7f7f7;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
 }

 .result_timer {
    font-family: 'Oswald', sans-serif; font-size: 40px;
    margin-top: 30px; 
    text-align: center;
 }

 .result_table {
    width: 77%;
    height: auto; 
    margin-top: 50px;
    background-color: #f7f7f7;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22); 
    margin-left: 10%;
    border-radius: 15px;
 }

 .result_title {
 	 float: left; 
 	 font-size: 30px; 
 	 margin-top: 25px;
 }

 @media (max-width: 600px) {
 	.result_timer {
 		font-size: 29px;
 	}

 	.result_title {
 		font-size: 25px;
 	}

 	.result_table {
 		width: 98%;
 		margin-left: 0%;
 	}
 }

</head>
<body style="background-color: #ddd">
	<div class="container">
		<div class="result_header">
			<div style="float: left;">
                <img src="/static/assets/img/logo/unnamed - Copy.png">
            </div>
              	<div class="result_title">Online Test Portal</div>
		</div>
		<div class="result_timer">You will be redirected to home page in 5 seconds.</div>
		<div class="table-responsive result_table">
			<table class="table table-bordered">
				<thead class="thead-dark" style="text-align: center;font-size: 30px">
					<tr>
						<th>Test Result</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>Number Of Question Attempted-</td>
					</tr>
					<tr>
						<td>Number Of Correct Choices-</td>
					</tr>
					<tr>
						<td>Total Marks Obtained-</td>
					</tr>
					<tr>
						<td>Out Of-</td>
					</tr>
				</tbody>
			</table>
		</div>	
		
	</div>
<script>
    setTimeout(function(){
       window.location.href = '{{ url_for('student_login') }}';
    }, 10000);
</script>
