<!DOCTYPE html>
<html>
<head>
	<title></title>

	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
<style>
	img {
  max-width  : 200px;
  height : 200px;
  border : 1px solid #c3c3c3;
  background-color: white;
  margin-top: 10px;
  border-radius: 100px;
  margin-right: 1%;
  background-image: url(/static/Profile_pics/default.jpg);
}

@media only screen and (min-width: 420px) {
	img {
		margin-left: 25px;
	}
}

.profile-form {
  max-width: 350px;
  padding: 10px 20px;
  background: #f4f7f8;
  border-radius: 8px;
  margin: auto;
  height: 920px;
  margin-top: 15px;
}

@media only screen and (max-width: 420px) {

  .profile-form {
    margin-left: -27px;
    width: 320px;
  }

  .button-section {
    margin-left: 65px;
    margin-top: 30px;
}

}



*, *:before, *:after {
  -moz-box-sizing: border-box;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}


h1 {
  margin: 0 0 30px 0;
  text-align: center;
}

input,
select {
  background: rgba(255,255,255,0.1);
  border: none;
  font-size: 16px;
  height: auto;
  margin: 0;
  outline: 0;
  padding: 15px;
  width: 100%;
  background-color: white;
  color: #8a97a0;
  box-shadow: 0 1px 0 rgba(0,0,0,0.03) inset;
  margin-bottom: 30px;
  text-align: center;

}

select {
  padding: 6px;
  height: 32px;
  border-radius: 2px;
}

fieldset {
  margin-bottom: 30px;
  border: none;
}

legend {
  font-size: 1.4em;
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 8px;
}

label.light {
  font-weight: 300;
  display: inline;
}

.number {
  background-color: #5fcf80;
  color: #fff;
  height: 30px;
  width: 30px;
  display: inline-block;
  font-size: 0.8em;
  margin-right: 4px;
  line-height: 30px;
  text-align: center;
  text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  border-radius: 100%;
}
</style>
</head>
<body>

      <form class="profile-form" role="form" action="" method="post">
      	 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <input type="hidden" name="hide" value="1">
      	<div class="col-md-12">
      		<div class="col-md-4"></div>
        	<div class="col-md-4">
				<canvas id = "can">
				</canvas>
				<script src = 'http://www.dukelearntoprogram.com/course1/common/js/image/SimpleImage.js'>
				</script>
			</div>
      		<div class="col-md-4"></div>
      	</div>
				<div id="GFG" style="text-align: center">
					<div>
						<div><h3><i>{{ current_user.role }}</i></h3></div>
					</div>
					<div><b><u>Name</u></b></div>
					<div><input type="text" class="form-control" id="name1" value="{{ current_user.username }}" name="stud_profile_name"></div>
					<div><b><u>CSVTU Roll Number</u></b></div>
					<div><input type="text" class="form-control" id="csvtuRollNo" value="{{ current_user.userid }}" name="csvturollno"></div>
					<div><b><u>College Name</u></b></div>
					<div><input type="text" class="form-control" id="clg" value="{{ current_user.college }}" name=""></div>
					
					<div><b><u>Branch</u></b></div>
					<div><input type="text" id="branch" class="form-control" value="{{ current_user.branch }}" name=""></div>
					
					<div><b><u>Semester</u></b></div>
					<div><input type="text" id="sem" class="form-control" value="{{ current_user.semester }}" name=""></div>
					<div><b><u>Section</u></b></div>
					<div><input type="text" class="form-control" id="section" value="{{ current_user.section }}" name=""></div>
					
					<div><b><u>Class Roll Number</u></b></div>
					<div><input type="text" class="form-control" id="clsRollNo" value="{{ current_user.rollno }}" name=""></div>
					
					<div><b><u>Email ID</u></b></div>
					<div><input type="email" class="form-control" id="email" value="{{ current_user.email }}" name=""></div>
				</div>
				<div style="width: 100%; float: left;">
    				<div class="button-section" style="">
    				<div>

						<input onclick="enable_disable()" type="submit" class="btn btn-primary" value="Save" id="save_btn" style="width: 65px;">

						<input onclick="disable_enable()" type="button" class="btn btn-primary" value="Edit" id="myButton2" style="width: 65px;margin-left: 10px">
					</div>
				</div>
			</div>
      </form>
      
    </body>
</html>
