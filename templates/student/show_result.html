<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" type="image/x-icon" href="/static/assets/img/logo/sstc-logo.png" />
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
		integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<link rel="stylesheet" href="/static/css/style_result.css">
	<title>SSTC Online Portal</title>

</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                              {% for category, message in messages %}
                                <div class="col-lg-12 alert alert-{{ category }}">
                                  {{ message }}
                                </div>
                              {% endfor %}
                            {% endif %}
                          {% endwith %}
	page rendering for 5 seconds

</body>
<script>
    setTimeout(function(){
       window.location.href = '{{ url_for('student_login') }}';
    }, 5000);
</script>

</html>
