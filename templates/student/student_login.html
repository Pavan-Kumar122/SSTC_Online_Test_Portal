        /*
    DEMO STYLE
*/
@import "https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700";
body {
    font-family: 'Poppins', sans-serif;
    background: #fafafa;
}

p {
    font-family: 'Poppins', sans-serif;
    font-size: 1.1em;
    font-weight: 300;
    line-height: 1.7em;
    color: #999;
}

a,
a:hover,
a:focus {
    color: inherit;
    text-decoration: none;
    transition: all 0.3s;
}

.navbar {
    padding: 15px 10px;
    background: #fff;
    border: none;
    border-radius: 0;
    margin-bottom: 40px;
    box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
}

.navbar-btn {
    box-shadow: none;
    outline: none !important;
    border: none;
}

.line {
    width: 100%;
    height: 1px;
    border-bottom: 1px dashed #ddd;
    margin: 40px 0;
}

i,
span {
    display: inline-block;
}

/* ---------------------------------------------------
    SIDEBAR STYLE
----------------------------------------------------- */

.wrapper {
    display: flex;
    align-items: stretch;
}

#sidebar {
    min-width: 250px;
    max-width: 250px;
    background: #00002d;
    color: #fff;
    transition: all 0.3s;
}

#sidebar.active {
    min-width: 80px;
    max-width: 80px;
    text-align: center;
}

#sidebar.active .sidebar-header h3,
#sidebar.active .CTAs {
    display: none;
}

#sidebar.active .sidebar-header strong {
    display: block;
}

#sidebar ul li a {
    text-align: left;
}

#sidebar.active ul li a {
    padding: 20px 10px;
    text-align: center;
    font-size: 0.85em;
}

#sidebar.active ul li a i {
    margin-right: 0;
    display: block;
    font-size: 1.8em;
    margin-bottom: 5px;
}

#sidebar.active ul ul a {
    padding: 10px !important;
}

#sidebar.active .dropdown-toggle::after {
    top: auto;
    bottom: 10px;
    right: 50%;
    -webkit-transform: translateX(50%);
    -ms-transform: translateX(50%);
    transform: translateX(50%);
}

#sidebar .sidebar-header {
    padding: 20px;
    background: #00002d;
}

#sidebar .sidebar-header strong {
    display: none;
    font-size: 1.8em;
}

#sidebar ul.components {
    padding: 20px 0;
    border-bottom: 1px solid #4b4276;
}

#sidebar ul li a {
    padding: 10px;
    font-size: 1.1em;
    display: block;
}

#sidebar ul li a:hover {
    color: #4b4276;
    background: #fff;
}

#sidebar ul li a i {
    margin-right: 10px;
}

#sidebar ul li.active>a,
a[aria-expanded="true"] {
    color: #fff;
    background: #4b4276;
}

a[data-toggle="collapse"] {
    position: relative;
}

.dropdown-toggle::after {
    display: block;
    position: absolute;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
}

ul ul a {
    font-size: 0.9em !important;
    padding-left: 30px !important;
    background: #4b4276;
}

ul.CTAs {
    padding: 20px;
}

ul.CTAs a {
    text-align: center;
    font-size: 0.9em !important;
    display: block;
    border-radius: 5px;
    margin-bottom: 5px;
}

a.download {
    background: #fff;
    color: #4b4276;
}

a.article,
a.article:hover {
    background: #4b4276 !important;
    color: #fff !important;
}

/* ---------------------------------------------------
    CONTENT STYLE
----------------------------------------------------- */

#content {
    width: 100%;
    padding: 20px;
    min-height: 100vh;
    transition: all 0.3s;
}

/* ---------------------------------------------------
    MEDIAQUERIES
----------------------------------------------------- */

@media (max-width: 768px) {
    #sidebar {
        min-width: 80px;
        max-width: 80px;
        text-align: center;
        margin-left: -80px !important;
    }
    .dropdown-toggle::after {
        top: auto;
        bottom: 10px;
        right: 50%;
        -webkit-transform: translateX(50%);
        -ms-transform: translateX(50%);
        transform: translateX(50%);
    }
    #sidebar.active {
        margin-left: 0 !important;
    }
    #sidebar .sidebar-header h3,
    #sidebar .CTAs {
        display: none;
    }
    #sidebar .sidebar-header strong h1 {
        display: block;
    }
    #sidebar ul li a {
        padding: 20px 10px;
    }
    #sidebar ul li a span {
        font-size: 0.85em;
    }
    #sidebar ul li a i {
        margin-right: 0;
        display: block;
    }
    #sidebar ul ul a {
        padding: 10px !important;
    }
    #sidebar ul li a i {
        font-size: 1.3em;
    }
    #sidebar {
        margin-left: 0;
    }
    #sidebarCollapse span {
        display: none;
    }
}

    <script>
                function exam()

                  var xhttp = new XMLHttpRequest();

                    }

                }

    <script>
        var question= ["What is the other name of Ironman?","Who is the most powerful in MCU till now?","What gives Hulk his power?","Who is the most powerful villain in MCU till now?","Who was the first Avenger?","Who is Sorcerer Supreme?","What is the weapon of Captain America?","Who is Hela?","Who is Peter Parker?","How many Infinity Stones are there?","Who got the idea of forming Avengers?","From where Vision got his power?","Who is MJ?","Who is having all the Infinity Stones?","How many Realms are there in MCU?","What weapon Thor was using in Avengers Infinity War?","Where the Vibranium is found in large quantity in MCU?","Thanos sacrified whom for Soul Stone?","Who is Winter Soldier?","Which Avenger uses the Bow and Arrow?"];



        var p;
        function show(v)
        {
            p=v; 
            var q= question[v]
            
            document.getElementById("question").innerHTML= +(v+1)+". "+q;

            if(v>0)
            {
                if(v<19)
                {
                document.getElementById("navigation_buttons").innerHTML= "<input type='button' class='btn btn-secondary' value= 'Previous' onclick= show("+(v-1)+") style='width: 100px;'><input type='button' class='btn btn-warning' value='Mark For Review' style='width:'><input type='button' class='btn btn-success' value='Save' style='width: '><input type='button' class='btn btn-danger' value='Clear Resonse' style='width: '><input type='button' class='btn btn-secondary' value= 'Next' onclick= show("+(v+1)+") style='width: 100px; margin-left:'>";
                }
            }
            
        }


        function examFunction() {
            var T1 = document.getElementById("ExamDiv");
            T1.style.display = "block";  


            var T2 = document.getElementById("timer_section");
            T2.style.display = "block";  

            document.getElementById("start/submit").style.borderColor = "green";
            document.getElementById("start/submit").style.backgroundColor = "green";


            document.getElementById("start/submit").value="Submit";




            /*timer*/
            var h=29;
            var m=59;
            var x= setInterval(function()
                              {
                                    document.getElementById("timer").innerHTML= h+":"+m;
                                    m--;

                                    if(m==-1)
                                    {
                                        h--;
                                        m=59;
                                    }

                                    if(h==-1)
                                    {
                                        clearInterval(m);
                                    }
                            },1000
                              );
}
