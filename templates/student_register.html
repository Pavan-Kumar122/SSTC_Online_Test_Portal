<!DOCTYPE html>
<html>

<head>
	<title></title>
</head>

<body>
	<div class="signup-form text-center">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input value = "1" type="hidden" name="id">
		<div class="form-group ">
			<div><input type="text" class="form-control  rounded-pill" name="Sname" placeholder="Enter Your Name"></div>
		</div>
		<div class="form-group">

			<div><input type="text" class="form-control  rounded-pill" name="Sid" placeholder="User ID"></div>
		</div>
            <div class="form-group">

			<div><input type="text" class="form-control  rounded-pill" name="Srollno" placeholder="Roll Number"></div>
		</div>

		<div class="form-group">

			<div><input type="email" class="form-control  rounded-pill" name="Semail" placeholder="Email"></div>
		</div>

		<div class="form-group">
			<select class="form-control branch rounded-pill" name="Sbranch">
				<option>Select Branch</option>
				<option>Computer Science Engineering</option>
				<option>Electronics and Tele-Communicatiom</option>
				<option>Information Technology</option>
				<option>Electrical and Electronics Engineering</option>
				<option>Electrical engineering</option>
				<option>Civil Engineering</option>
				<option>Mechanical Engineering</option>
			</select>
		</div>
            <div class="form-group ">
			<select class="form-control sem rounded-pill" name="Ssection">
				<option>Section</option>
				<option>A</option>
				<option>B</option>
				<option>C</option>

			</select>
		</div>
		<div class="form-group ">
			<select class="form-control sem rounded-pill" name="Ssemester">
				<option>Semester</option>
				<option>1</option>
				<option>2</option>
				<option>3</option>
				<option>4</option>
				<option>5</option>
				<option>6</option>
				<option>7</option>
				<option>8</option>
			</select>
		</div>

		<div class="form-group ">
			<select class="form-control sem rounded-pill" name="Scollege">
				<option>Select College</option>
				<option>SSGI (S1)</option>
				<option>SSEC (S2)</option>

			</select>
		</div>

		<div class="form-group">

			<div><input type="password" class="form-control pw rounded-pill" name="Spassword" placeholder="Password"></div>
		</div>
		<div><input type="reset" class="btn btn-dark  reset btn3 rounded-pill" value="Reset" name="">
			<input type="submit" class="btn btn-success submit btn3 rounded-pill" value="Submit" name=""></div>
		<div></div>
            </form>
	</div>
</body>

</html>
